blueprint:
  name: "OpenEPaperLink: Countdown bis Datum (DE)"
  description: >
    Rendert ein einfaches Countdown-Bild (deutsche Texte) und sendet es an ein OpenEPaperLink-Tag.
    Zeigt 'noch X Tage', 'morgen', 'heute', 'gestern' oder 'seit X Tagen'.
  domain: automation

  input:
    target_date:
      name: Zieldatum
      description: "Datum im Format YYYY-MM-DD (z.B. 2026-12-24)"
      selector:
        text: {}

    title:
      name: Titelzeile
      description: "z.B. 'Weihnachten' / 'Urlaub' / 'Geburtstag'"
      default: "Countdown"
      selector:
        text: {}

    font_file:
      name: Schriftart
      description: >-
        Dateiname oder absoluter Pfad zur Schriftart (z. B.
        fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf).
      default: fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf

    tag_device:
      name: OpenEPaperLink Tag (Device)
      description: "Wähle das Tag-Device aus dem OpenEPaperLink-Integrationseintrag."
      selector:
        device:
          integration: open_epaper_link

    update_time:
      name: Tägliche Update-Uhrzeit
      description: "Wann soll täglich aktualisiert werden?"
      default: "00:05:00"
      selector:
        time: {}

    also_on_startup:
      name: Auch bei Home Assistant Start aktualisieren
      default: true
      selector:
        boolean: {}

mode: single

trigger:
  - platform: time
    at: !input update_time
  - platform: homeassistant
    event: start

condition:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ trigger.platform != 'homeassistant' }}"
      - condition: template
        value_template: "{{ (trigger.platform == 'homeassistant') and (iif(blueprint.input.also_on_startup, true, false)) }}"

variables:
  v_target_date: !input target_date
  v_title: !input title
  v_font_file: !input font_file

  v_days_diff: >-
    {% set t = strptime(v_target_date, '%Y-%m-%d') %}
    {% set today = now().date() %}
    {{ (t.date() - today).days }}

  v_line2: >-
    {% set d = v_days_diff | int %}
    {% if d > 1 %}
      noch {{ d }} Tage
    {% elif d == 1 %}
      morgen
    {% elif d == 0 %}
      heute
    {% elif d == -1 %}
      gestern
    {% else %}
      seit {{ (d * -1) }} Tagen
    {% endif %}

  v_date_de: >-
    {% set t = strptime(v_target_date, '%Y-%m-%d') %}
    {{ t.strftime('%d.%m.%Y') }}

action:
  - action: open_epaper_link.drawcustom
    target:
      device_id: !input tag_device
    data:
      background: white
      rotate: 0
      dither: 2
      ttl: 300
      payload:
        - type: rectangle
          x_start: 0
          y_start: 0
          x_end: 399
          y_end: 299
          fill: white
          outline: white

        - type: text
          value: "{{ v_title }}"
          x: 20
          y: 70
          font: "{{ v_font_file }}"
          size: 42
          color: black

        - type: line
          x_start: 20
          y_start: 95
          x_end: 380
          y_end: 95
          width: 2
          fill: black

        - type: text
          value: "{{ v_line2 }}"
          x: 20
          y: 150
          font: "{{ v_font_file }}"
          size: 56
          color: black

        - type: text
          value: "{{ v_date_de }}"
          x: 20
          y: 220
          font: "{{ v_font_file }}"
          size: 32
          color: black
