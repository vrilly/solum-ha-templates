blueprint:
  name: OpenEPaperLink Solum M2 Aktualisierungsplan
  description: >-
    Fuehrt ein ausgewaehltes Dashboard-Skript zeitgesteuert aus:
    tagsueber alle 15 Minuten, nachts (23:00-07:00) nur stuendlich.
  domain: automation
  input:
    dashboard_script:
      name: Dashboard Skript
      description: Das Skript, das den Solum-M2-Inhalt rendert und sendet.
      selector:
        entity:
          domain: script

trigger:
  - platform: time_pattern
    minutes: "/15"
    id: quarter_hour_day

  - platform: time_pattern
    minutes: "0"
    id: hourly_night

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: quarter_hour_day
          - condition: template
            value_template: "{{ now().hour >= 7 and now().hour < 23 }}"
        sequence:
          - action: script.turn_on
            target:
              entity_id: !input dashboard_script

      - conditions:
          - condition: trigger
            id: hourly_night
          - condition: template
            value_template: "{{ now().hour >= 23 or now().hour < 7 }}"
        sequence:
          - action: script.turn_on
            target:
              entity_id: !input dashboard_script

mode: single
